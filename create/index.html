<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Budget Buddy - Login / Sign Up</title>
    <link rel="stylesheet" href="create.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="container">
        <div class="login-wrapper">
            <!-- Logo Section -->
            <div class="logo-section">
                <h1 class="app-title">Smart Budget Buddy</h1>
                <p class="tagline">Your Personal Financial Companion</p>
            </div>

            <!-- Toggle Buttons (NEW) -->
            <div class="toggle-container">
                <button class="toggle-btn active" id="loginToggle">Login</button>
                <button class="toggle-btn" id="signupToggle">Sign Up</button>
            </div>

            <!-- Google Sign-In Container -->
            <div class="google-auth" style="margin-bottom: 20px; display: flex; justify-content: center;">
                <div id="googleSignInContainer"></div>
            </div>
            <div class="divider"
                style="text-align: center; margin-bottom: 20px; color: #999; font-size: 14px; display: flex; align-items: center;">
                <span style="flex: 1; height: 1px; background: #333; margin-right: 15px;"></span>
                OR
                <span style="flex: 1; height: 1px; background: #333; margin-left: 15px;"></span>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <input type="text" id="loginEmail" class="form-input" placeholder="Email or Phone Number" required>
                </div>

                <div class="form-group">
                    <input type="password" id="loginPassword" class="form-input" placeholder="Password" required>
                    <a href="#" class="forgot-password" id="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <!-- Signup Form (NEW) -->
            <form class="auth-form" id="signupForm" style="display: none;">
                <div class="form-group">
                    <input type="text" id="signupFirstName" class="form-input" placeholder="First Name" required>
                </div>

                <div class="form-group">
                    <input type="text" id="signupLastName" class="form-input" placeholder="Last Name" required>
                </div>

                <div class="form-group">
                    <input type="email" id="signupEmail" class="form-input" placeholder="Email Address" required>
                </div>

                <div class="form-group">
                    <input type="tel" id="signupPhone" class="form-input" placeholder="Phone Number (optional)">
                </div>

                <div class="form-group">
                    <input type="password" id="signupPassword" class="form-input" placeholder="Password" required>
                </div>

                <div class="form-group">
                    <input type="password" id="signupConfirmPassword" class="form-input" placeholder="Confirm Password"
                        required>
                </div>

                <div class="form-group">
                    <input type="date" id="signupDob" class="form-input" placeholder="Date of Birth">
                </div>

                <div class="terms-checkbox">
                    <input type="checkbox" id="termsAgree" required>
                    <label for="termsAgree">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy
                            Policy</a></label>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <!-- Footer -->
            <div class="footer-text">
                <p>&copy; 2026 Budget Buddy. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="create.js"></script>
</body>

</html>
