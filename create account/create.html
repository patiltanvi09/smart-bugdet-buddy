<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Buddy - Login</title>
    <link rel="stylesheet" href="create.css">
</head>
<body>
    <div class="container">
        <div class="login-wrapper">
            <!-- Logo Section -->
            <div class="logo-section">
                <h1 class="app-title">Budget Buddy</h1>
                <p class="tagline">Your Personal Financial Companion</p>
            </div>

            <!-- Login Form -->
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <input 
                        type="text" 
                        id="emailInput" 
                        class="form-input" 
                        placeholder="Email or Phone Number"
                        required
                    >
                </div>

                <div class="form-group">
                    <input 
                        type="password" 
                        id="passwordInput" 
                        class="form-input" 
                        placeholder="Password"
                        required
                    >
                    <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>

                <div class="divider">
                    <span>or</span>
                </div>

                <p class="signup-text">
                    Don't have an account? <a href="#" class="signup-link">Create one</a>
                </p>
            </form>

            <!-- Footer -->
            <div class="footer-text">
                <p>&copy; 2026 Budget Buddy. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="create.js"></script>
</body>
</html>
