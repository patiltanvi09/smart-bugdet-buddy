<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Buddy - Forgot Password</title>
    <link rel="stylesheet" href="create.css">
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>
    <div class="container">
        <div class="login-wrapper forgot-password-wrapper">
            <!-- Logo Section -->
            <div class="logo-section">
                <h1 class="app-title">Budget Buddy</h1>
                <p class="tagline">Reset Your Password</p>
            </div>

            <!-- Back Button -->
            <a href="index.html" class="back-button">← Back to Login</a>

            <!-- Forgot Password Form -->
            <form class="forgot-password-form" id="forgotPasswordForm">
                <!-- Email Input Section -->
                <div id="emailSection" class="form-section active">
                    <div class="form-group">
                        <input 
                            type="email" 
                            id="emailInput" 
                            class="form-input" 
                            placeholder="Enter your email address"
                            required
                        >
                    </div>

                    <button type="button" class="submit-btn" id="submitEmailBtn">Send Security Code</button>
                </div>

                <!-- Code Verification Section -->
                <div id="codeSection" class="form-section">
                    <div class="form-group">
                        <input 
                            type="text" 
                            id="securityCodeInput" 
                            class="form-input" 
                            placeholder="Enter 6-digit security code"
                            maxlength="6"
                            inputmode="numeric"
                            disabled
                        >
                    </div>

                    <!-- Send Code Link and Timer -->
                    <div class="code-action-container">
                        <a href="#" id="sendCodeLink" class="send-code-link">Send code</a>
                        <span id="timerDisplay" class="timer-display"></span>
                    </div>

                    <button type="submit" class="submit-btn" id="verifyCodeBtn" disabled>Verify Code</button>
                </div>
            </form>

            <!-- Link back to login -->
            <div class="footer-text">
                <p>Remembered your password? <a href="index.html" class="login-link">Sign in here</a></p>
            </div>
        </div>
    </div>

    <script src="forgot-password.js"></script>
</body>
</html>
